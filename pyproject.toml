[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jester-mixed-inference"
version = "0.1.0"
description = "Jester component 2/5: dynamic facet composition, inference, and Trainer gradient workers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "jester-core>=0.1,<1",
  "jester-rm-client>=0.1,<1",
  "torch>=2.2,<3",
  "transformers>=4.51,<5",
  "accelerate>=1,<2",
  "safetensors>=0.4",
  "pydantic>=2.8,<3",
  "zstandard>=0.23,<1",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
j-mi = "mixed_inference.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["mi"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["mixed_inference*"]
