[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jester-mixed-inference"
version = "0.1.0"
description = "Jester component 2/5: dynamic facet composition, inference, and Trainer gradient workers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "torch>=2.2",
  "transformers>=4.46",
  "safetensors>=0.4",
  "pydantic>=2.8,<3",
  "zstandard>=0.23,<1",
]

[project.scripts]
j-mi = "mixed_inference.cli:main"

[tool.setuptools.packages.find]
include = ["mixed_inference*"]
