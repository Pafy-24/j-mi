openapi: 3.1.0
info:
  title: Jester Mixed Inference API
  version: 0.1.0
  description: Component 2/5. Generate/composition and RM-managed gradient worker; Trainer owns jobs.
servers:
  - url: http://127.0.0.1:8120
    description: mi.serve
  - url: http://127.0.0.1:8130
    description: mi.worker
paths:
  /health:
    get:
      summary: MI generate service health
      responses:
        "200": {description: Health payload}
  /facets:
    get:
      summary: List registered facets
      responses:
        "200": {description: Facet list}
  /base/load:
    post:
      summary: Load the RM-bound base model
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/BaseModel"}
      responses:
        "200": {description: Loaded base summary}
  /compose:
    post:
      summary: Resolve the requested facet dependency DAG
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/FacetSelection"}
      responses:
        "200": {description: Deterministic composition plan}
  /generate:
    post:
      summary: Compose facets and generate
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/GenerateRequest"}
      responses:
        "200": {description: Generated output, usage and timing}
  /v1/health:
    get:
      summary: MI worker health
      responses:
        "200": {description: Worker state and capabilities}
  /v1/capabilities:
    get:
      summary: Discovered, allocatable, autograd and verified backends
      responses:
        "200": {description: Worker capabilities}
  /v1/sessions:
    get:
      summary: List worker sessions owned by Trainer
      responses:
        "200": {description: Session summaries}
    post:
      summary: Create an idempotent Trainer-owned worker session
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "./mi-worker-task-v1.schema.json"}
      responses:
        "201": {description: Session created}
        "409": {description: Session/configuration conflict}
  /v1/sessions/{sessionId}:
    get:
      summary: Inspect a worker session
      parameters:
        - {$ref: "#/components/parameters/SessionId"}
      responses:
        "200": {description: Session state}
    delete:
      summary: Close a non-running session while retaining audit artifacts
      parameters:
        - {$ref: "#/components/parameters/SessionId"}
      responses:
        "200": {description: Session closed}
  /v1/sessions/{sessionId}/weights/{version}:
    get:
      summary: Download current child weights with optional Range
      parameters:
        - {$ref: "#/components/parameters/SessionId"}
        - {$ref: "#/components/parameters/Version"}
      responses:
        "200": {description: Safetensors body}
        "206": {description: Safetensors byte range}
    put:
      summary: Resumable child weight upload with Content-Range and SHA-256
      parameters:
        - {$ref: "#/components/parameters/SessionId"}
        - {$ref: "#/components/parameters/Version"}
      responses:
        "200": {description: Upload state}
  /v1/sessions/{sessionId}/rounds/{round}/compute:
    post:
      summary: Compute only child-facet gradients for a deterministic shard slice
      parameters:
        - {$ref: "#/components/parameters/SessionId"}
        - {$ref: "#/components/parameters/Round"}
      responses:
        "200": {description: Idempotent gradient contribution metadata}
        "409": {description: Stale weight or round hash conflict}
  /v1/sessions/{sessionId}/rounds/{round}:
    get:
      summary: Inspect a round without downloading its gradient body
      parameters:
        - {$ref: "#/components/parameters/SessionId"}
        - {$ref: "#/components/parameters/Round"}
      responses:
        "200": {description: Round state and contribution metadata}
  /v1/sessions/{sessionId}/rounds/{round}/gradient:
    get:
      summary: Download gradient safetensors with Range/resume
      parameters:
        - {$ref: "#/components/parameters/SessionId"}
        - {$ref: "#/components/parameters/Round"}
      responses:
        "200": {description: Gradient body}
        "206": {description: Gradient byte range}
  /v1/sessions/{sessionId}/rounds/{round}/ack:
    post:
      summary: Acknowledge that Trainer committed or aborted the round
      parameters:
        - {$ref: "#/components/parameters/SessionId"}
        - {$ref: "#/components/parameters/Round"}
      responses:
        "200": {description: Updated round state}
  /v1/sessions/{sessionId}/actions/cancel:
    post:
      summary: Request cooperative cancellation of current worker work
      parameters:
        - {$ref: "#/components/parameters/SessionId"}
      responses:
        "200": {description: Cancellation state}
components:
  parameters:
    SessionId: {in: path, name: sessionId, required: true, schema: {type: string}}
    Version: {in: path, name: version, required: true, schema: {type: string}}
    Round: {in: path, name: round, required: true, schema: {type: integer, minimum: 0}}
  schemas:
    BaseModel:
      type: object
      required: [id]
      properties:
        id: {type: string}
        revision: {type: [string, "null"]}
        dtype: {enum: [auto, float32, float16, bfloat16]}
        device: {const: managed}
    FacetSelection:
      type: object
      required: [facets]
      properties:
        facets: {type: array, items: {type: string}}
    GenerateRequest:
      type: object
      properties:
        prompt: {type: string}
        messages: {type: array, items: {type: object}}
        facets: {type: array, items: {type: string}}
        generation: {type: object}
        seed: {type: integer}
      oneOf:
        - required: [prompt]
        - required: [messages]
